name: Deploy Visual Test Page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx tsc

      - run: npx rollup -c

      - name: Prepare Pages output
        run: |
          mkdir -p _site
          cp test/visual/index.html _site/index.html
          cp progress-component.bundled.js _site/
          sed -i 's|<script src="../../node_modules/@webcomponents/webcomponentsjs/webcomponents-loader.js"></script>||' _site/index.html
          sed -i 's|<script src="../../node_modules/lit/polyfill-support.js"></script>||' _site/index.html
          sed -i 's|../../progress-component.js|./progress-component.bundled.js|' _site/index.html

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
